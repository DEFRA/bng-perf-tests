name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    if: github.run_number != 1
    name: Build, version and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          # Materialise the git-LFS perf fixtures (scenarios/fixtures/*.gpkg) so
          # the Docker build COPYs the real GeoPackages into the image, not their
          # LFS pointer files. Without this the baseline-overlap-scaling scenario
          # ships broken on CDP.
          lfs: true

      - name: Build the test suite
        uses: DEFRA/cdp-build-action/build-test@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
