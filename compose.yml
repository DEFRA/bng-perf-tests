# Standalone local run of the perf suite from *inside this repo*.
#
#   docker compose up --build
#
# The suite (home-page smoke test by default) is fired at an ALREADY-RUNNING
# frontend on the host — normally the one the harness brings up (`npm run dev`
# in bng-metric-harness, or Tilt). We do NOT stand the app up here: the frontend
# needs the whole backend stack (Postgres, Redis, Defra ID stub, OIDC discovery)
# to boot, which lives in bng-metric-backend's compose — duplicating it here
# would just rot. The home page is public, so a reachable frontend is all the
# smoke test needs.
#
# By default it targets http://host.docker.internal:3000 (the host's frontend).
# Override the target to hit a deployed CDP environment instead, e.g.
#   SERVICE_ENDPOINT=bng-metric-frontend.dev.cdp-int.defra.cloud \
#   SERVICE_PORT=443 SERVICE_URL_SCHEME=https ENVIRONMENT=dev \
#   docker compose up --build
#
# LocalStack stands in for S3 so the entrypoint's results-publish step succeeds
# (it exits non-zero if RESULTS_OUTPUT_S3_PATH is unset); reports also land in
# ./reports on the host.
services:
  development:
    build: .
    volumes:
      - ./reports:/opt/perftest/reports
    depends_on:
      localstack:
        condition: service_healthy
    # host.docker.internal resolves to the host that runs the frontend. On
    # Docker Desktop it exists already; on Linux it needs this explicit mapping.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - 'compose/aws.env'
    environment:
      S3_ENDPOINT: 'http://localstack:4566'
      RESULTS_OUTPUT_S3_PATH: 's3://test-results'
      TEST_SCENARIO: ${TEST_SCENARIO:-home-page}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SERVICE_ENDPOINT: ${SERVICE_ENDPOINT:-host.docker.internal}
      SERVICE_PORT: ${SERVICE_PORT:-3000}
      SERVICE_URL_SCHEME: ${SERVICE_URL_SCHEME:-http}
    networks:
      - performance-tests

  localstack:
    image: localstack/localstack:4.3.0
    ports:
      - '4566:4566' # LocalStack Gateway
      - '4510-4559:4510-4559' # external services port range
    restart: always
    env_file:
      - 'compose/aws.env'
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN # Localstack DEBUG Level
      SERVICES: s3, sqs, sns
      LOCALSTACK_HOST: 127.0.0.1
    volumes:
      - '${TMPDIR:-/tmp}/localstack:/var/lib/localstack'
      - ./compose/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: [ "CMD", "stat", "/tmp/READY" ]
      interval: 3s
      start_period: 5s
      retries: 3
    networks:
      - performance-tests

networks:
  performance-tests:
    driver: bridge
